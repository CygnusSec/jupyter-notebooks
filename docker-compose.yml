services:
  jupyterhub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: jupyterhub
    ports:
      - "${HUB_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub
    environment:
      - DOCKER_NOTEBOOK_IMAGE=jupyter-notebook-user:latest
      - DOCKER_NETWORK_NAME=jupyter-network
      - ADMIN_USERS=${ADMIN_USERS:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-true}
      - USER_MEM_LIMIT=${USER_MEM_LIMIT:-4G}
      - USER_CPU_LIMIT=${USER_CPU_LIMIT:-2.0}
    networks:
      - jupyter-network
    restart: unless-stopped

networks:
  jupyter-network:
    name: jupyter-network

volumes:
  jupyterhub-data:
